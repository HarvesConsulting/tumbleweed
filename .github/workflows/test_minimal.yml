name: Minimal test

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run cycle step by step
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TUMBLEWEED_BOT_TOKEN: ${{ secrets.TUMBLEWEED_BOT_TOKEN }}
          RENTALERT_BOT_URL: ${{ secrets.RENTALERT_BOT_URL }}
        run: |
          echo "[1] STEP: Turso connect"
          python -c "from tumbleweed.config import settings; from tumbleweed.db.client import TursoClient; c = TursoClient(settings.turso_url, settings.turso_token); print('OK:', c.execute('SELECT COUNT(*) FROM vacancies')[0][0])"
          echo "[2] STEP: build_jobs"
          python -c "import sys; sys.path.insert(0, 'scripts'); from run_cycle_jobs import build_jobs; jobs = build_jobs(); print(f'Jobs: {len(jobs)}')"
          echo "[3] STEP: one parser call"
          timeout 90 python -c "import asyncio; from tumbleweed.parsers.registry import get_parsers; async def m(): p=get_parsers('ua')[0]; v=await p.fetch(city_slug='kyiv', query='python', limit=3); print(f'Got: {len(v)}'); asyncio.run(m())" || echo "TIMEOUT_3"
          echo "[4] STEP: save_and_mark one vacancy"
          timeout 90 python -c "import asyncio; from tumbleweed.config import settings; from tumbleweed.db.client import TursoClient; from tumbleweed.parsers.registry import get_parsers; from tumbleweed.db.queries_jobs import save_and_mark; async def m(): p=get_parsers('ua')[0]; v=await p.fetch(city_slug='kyiv', query='python', limit=3); c=TursoClient(settings.turso_url, settings.turso_token); save_and_mark(c, v[0]) if v else None; print('Saved'); asyncio.run(m())" || echo "TIMEOUT_4"
          echo "[5] STEP: full run_cycle_jobs (limited)"
          timeout 120 python -c "import asyncio, sys; sys.path.insert(0, 'scripts'); exec(open('scripts/run_cycle_jobs.py').read().replace('asyncio.run(main())', 'pass')); asyncio.run(main())" || echo "TIMEOUT_5"
          echo "=== ALL STEPS DONE ==="
