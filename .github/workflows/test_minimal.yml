name: Minimal test

on:
  repository_dispatch:
    types: [minimal_test]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/tumbleweed/parsers/**'
      - 'scripts/run_cycle_jobs.py'
      - 'scripts/run_notify.py'
      - '.github/workflows/aggregate_jobs.yml'
      - '.github/workflows/test_minimal.yml'

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Hello
        run: echo "Hello"
      - name: Install editable
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run cycle (dry)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -c "print('Would run cycle here')"
