name: Minimal test

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run cycle (limited)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TUMBLEWEED_BOT_TOKEN: ${{ secrets.TUMBLEWEED_BOT_TOKEN }}
          RENTALERT_BOT_URL: ${{ secrets.RENTALERT_BOT_URL }}
        run: |
          echo "=== START CYCLE ==="
          timeout 180 python scripts/run_cycle_jobs.py || echo "TIMEOUT OR ERROR"
          echo "=== END CYCLE ==="
