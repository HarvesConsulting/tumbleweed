name: Minimal test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/tumbleweed/parsers/**'
      - 'scripts/run_cycle_jobs.py'
      - 'scripts/run_notify.py'
      - '.github/workflows/aggregate_jobs.yml'

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
