name: Minimal test

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Test parsers only
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          echo "=== START ==="
          python -c "
          import asyncio
          from tumbleweed.parsers.registry import get_parsers
          async def main():
              p = get_parsers('ua')
              print(f'Parsers: {len(p)}')
              v = await p[0].fetch(city_slug='kyiv', query='python', limit=3)
              print(f'Got: {len(v)} vacancies')
          asyncio.run(main())
          "
          echo "=== DONE ==="
