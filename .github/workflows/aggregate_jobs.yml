name: TumbleWeed — aggregate & notify

on:
  # GitHub schedule ненадійний на free tier — використовуємо repository_dispatch
  # з cron-job.org (як у rentalert-v2)
  repository_dispatch:
    types: [tumbleweed_aggregate]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/tumbleweed/parsers/**'
      - 'scripts/run_cycle_jobs.py'
      - 'scripts/run_notify.py'
      - '.github/workflows/aggregate_jobs.yml'

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run parser cycle
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TUMBLEWEED_BOT_TOKEN: ${{ secrets.TUMBLEWEED_BOT_TOKEN }}
          RENTALERT_BOT_URL: ${{ secrets.RENTALERT_BOT_URL }}
        run: python scripts/run_cycle_jobs.py

      - name: Run notifier
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TUMBLEWEED_BOT_TOKEN: ${{ secrets.TUMBLEWEED_BOT_TOKEN }}
          RENTALERT_BOT_URL: ${{ secrets.RENTALERT_BOT_URL }}
        run: python scripts/run_notify.py
