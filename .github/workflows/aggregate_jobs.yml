name: TumbleWeed — aggregate & notify

on:
  repository_dispatch:
    types: [tumbleweed_aggregate]
  workflow_dispatch: {}
  

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Cleanup old
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -u scripts/cleanup_old_vacancies.py          

      - name: Parse
        env:
          PYTHONUNBUFFERED: "1"
          USE_WORKUA: "0"           # ← ДОДАНО: Work.ua блокується Cloudflare
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TUMBLEWEED_BOT_TOKEN: ${{ secrets.TUMBLEWEED_BOT_TOKEN }}
          RENTALERT_BOT_URL: ${{ secrets.RENTALERT_BOT_URL }}
        run: python -u scripts/run_cycle_jobs.py

      - name: Notify
        env:
          PYTHONUNBUFFERED: "1"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TUMBLEWEED_BOT_TOKEN: ${{ secrets.TUMBLEWEED_BOT_TOKEN }}
          RENTALERT_BOT_URL: ${{ secrets.RENTALERT_BOT_URL }}
        run: python -u scripts/run_notify.py
