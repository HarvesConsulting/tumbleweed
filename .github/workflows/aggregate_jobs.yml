name: TumbleWeed — aggregate & notify

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run parser cycle (OLX UA/PL/RO)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          TUMBLEWEED_BOT_TOKEN: ${{ secrets.TUMBLEWEED_BOT_TOKEN }}
          RENTALERT_BOT_URL:  ${{ secrets.RENTALERT_BOT_URL }}
        run: python scripts/run_cycle_jobs.py

      - name: Run notifier (match + send)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          TUMBLEWEED_BOT_TOKEN: ${{ secrets.TUMBLEWEED_BOT_TOKEN }}
          RENTALERT_BOT_URL:  ${{ secrets.RENTALERT_BOT_URL }}
        run: python scripts/run_notify.py