name: TumbleWeed — aggregate & notify

on:
  repository_dispatch:
    types: [tumbleweed_aggregate]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/tumbleweed/parsers/**'
      - 'scripts/run_cycle_jobs.py'
      - 'scripts/run_notify.py'
      - '.github/workflows/aggregate_jobs.yml'

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Parse
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TUMBLEWEED_BOT_TOKEN: ${{ secrets.TUMBLEWEED_BOT_TOKEN }}
          RENTALERT_BOT_URL: ${{ secrets.RENTALERT_BOT_URL }}
        run: python scripts/run_cycle_jobs.py

      - name: Notify
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TUMBLEWEED_BOT_TOKEN: ${{ secrets.TUMBLEWEED_BOT_TOKEN }}
          RENTALERT_BOT_URL: ${{ secrets.RENTALERT_BOT_URL }}
        run: python scripts/run_notify.py
